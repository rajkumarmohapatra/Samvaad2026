name: Samvaad portal tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TESTING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portal/requirements.lock
      - run: python -m pip install -r portal/requirements.lock
      - run: python portal/manage.py check
      - run: python portal/manage.py test operations --verbosity 1
      - run: python -m unittest discover -s tests -v
